[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-todo"
version = "1.1.1"
description = "What is still open across your Claude Code sessions: terminal panel and status-bar output"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
claude-todo = "claude_todo.cli:main"

[tool.setuptools]
packages = ["claude_todo"]
