[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-todo"
version = "1.1.1"
description = "What is still open across your Claude Code sessions: terminal panel and status-bar output"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]

[project.gui-scripts]
claude-todo-gui = "claude_todo.gui_entry:main_gui"

[project.scripts]
claude-todo = "claude_todo.cli:main"

[tool.setuptools]
packages = ["claude_todo"]
