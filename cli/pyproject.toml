[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leftovers"
version = "1.2.1"
description = "Leftovers: the unfinished work across your Claude Code sessions (window, tray icon, terminal panel, status-bar output)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]

[project.gui-scripts]
leftovers-gui = "claude_todo.gui_entry:main_gui"
claude-todo-gui = "claude_todo.gui_entry:main_gui"   # pre-rename name

[project.scripts]
leftovers = "claude_todo.cli:main"
claude-todo = "claude_todo.cli:main"   # pre-rename name

[tool.setuptools]
packages = ["claude_todo"]
