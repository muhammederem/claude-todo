name: ClaudeTodo
options:
  bundleIdPrefix: com.muhammederem
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  ClaudeTodo:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Leftovers
        CFBundleDisplayName: Leftovers
        CFBundleShortVersionString: "1.2.1"
        CFBundleVersion: "5"
        LSUIElement: true
        NSAppleEventsUsageDescription: Leftovers types the task you click into the Claude Code session's own Terminal or iTerm tab.
        CFBundleURLTypes:
          - CFBundleURLName: com.muhammederem.claude-todo
            CFBundleURLSchemes: [claudetodo]
    entitlements:
      path: App/Leftovers.entitlements
      properties:
        # hardened runtime: needed to script Terminal and iTerm
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammederem.claude-todo
        PRODUCT_NAME: Leftovers
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ClaudeTodoWidget
        embed: true
  ClaudeTodoWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleName: Leftovers Widget
        CFBundleShortVersionString: "1.2.1"
        CFBundleVersion: "5"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # The sandboxed widget reads state.json and stores the picked tab in this folder.
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/ClaudeTodo/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammederem.claude-todo.widget
        GENERATE_INFOPLIST_FILE: NO
