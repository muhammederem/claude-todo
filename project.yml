name: ClaudeTodo
options:
  bundleIdPrefix: com.muhammederem
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Xcode'a Apple ID ile giriş yapınca takım kimliğini buraya yaz (10 karakter).
targets:
  ClaudeTodo:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Claude To-Do
        CFBundleShortVersionString: "1.1.1"
        CFBundleVersion: "3"
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: com.muhammederem.claude-todo
            CFBundleURLSchemes: [claudetodo]
    entitlements:
      path: App/ClaudeTodo.entitlements
      properties:
        # iPhone sync (CloudKit, private database only)
        com.apple.developer.icloud-container-identifiers: [iCloud.com.muhammederem.claude-todo]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammederem.claude-todo
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ClaudeTodoWidget
        embed: true
  ClaudeTodoWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleName: Claude To-Do Widget
        CFBundleShortVersionString: "1.1.1"
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # The sandboxed widget reads state.json and stores the picked tab in this folder.
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/ClaudeTodo/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammederem.claude-todo.widget
        GENERATE_INFOPLIST_FILE: NO
  ClaudeTodoPhone:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Claude To-Do
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.muhammederem.claude-todo.ios
            CFBundleURLSchemes: [claudetodo]
    entitlements:
      path: iOS/Phone.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.com.muhammederem.claude-todo]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.muhammederem.claude-todo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammederem.claude-todo.ios
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ClaudeTodoPhoneWidget
        embed: true
  ClaudeTodoPhoneWidget:
    type: app-extension
    platform: iOS
    sources: [iOSWidget, Shared]
    info:
      path: iOSWidget/Info.plist
      properties:
        CFBundleDisplayName: Claude To-Do
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: iOSWidget/Widget.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.muhammederem.claude-todo]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.muhammederem.claude-todo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammederem.claude-todo.ios.widget
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
