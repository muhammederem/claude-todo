name: cli
on:
  push:
    paths: ["cli/**", ".github/workflows/cli.yml"]
  pull_request:
    paths: ["cli/**"]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
        exclude:      # setup-python has no 3.9 build for these images; 3.9 is covered on ubuntu-22.04 and windows
          - { os: ubuntu-latest, python: "3.9" }
          - { os: macos-latest, python: "3.9" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s . -t . -p "test_*.py" -v
      - run: pip install . && claude-todo --version

  gui:
    name: gui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install ".[gui]"
      - run: python -m unittest tests.test_gui -v
